<title>Cockpit Docs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;700&display=swap">
<style>
/* Layout: a docs shell. Top bar, section nav on the left, the page in a 46rem column, its outline on the right. */
:root {
  --bg: #f7f7fa;
  --surface: #ffffff;
  --sunk: #f1f0f6;
  --fg: #17161f;
  --muted: #5d5b6e;
  --faint: #8d8b9e;
  --line: #e6e5ee;
  --accent: #6e56cf;
  --accent-ink: #5b45b8;
  --accent-soft: #efeafe;
  --warn: #9a6200;
  --warn-soft: #fbf0d9;
  --term-bg: #0f0e16;
  --term-fg: #e2e0ec;
  --term-dim: #77748c;
  --term-bar: #1a1824;
  --font-sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "Geist Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --top: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0c0b11; --surface: #15141c; --sunk: #1c1b25; --fg: #edecf3; --muted: #a3a1b3; --faint: #6f6d82; --line: #25242f;
    --accent: #a594f9; --accent-ink: #c4b8ff; --accent-soft: #241e3d; --warn: #f0b84f; --warn-soft: #2e2510;
    --term-bg: #08070d; --term-bar: #131219; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0c0b11; --surface: #15141c; --sunk: #1c1b25; --fg: #edecf3; --muted: #a3a1b3; --faint: #6f6d82; --line: #25242f;
  --accent: #a594f9; --accent-ink: #c4b8ff; --accent-soft: #241e3d; --warn: #f0b84f; --warn-soft: #2e2510;
  --term-bg: #08070d; --term-bar: #131219; color-scheme: dark;
}
* { box-sizing: border-box; }
html { scroll-padding-top: calc(var(--top) + 16px); }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.65 var(--font-sans); -webkit-font-smoothing: antialiased; }
a { color: var(--accent-ink); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
code { font-family: var(--font-mono); font-size: .86em; background: var(--sunk); border: 1px solid var(--line); border-radius: 5px; padding: .08em .35em; }
.mono { font-family: var(--font-mono); font-size: .86rem; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; height: var(--top); display: flex; align-items: center; gap: 16px; padding-inline: 20px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.brand { display: flex; align-items: center; gap: 10px; color: var(--fg); font-weight: 700; font-size: 1.06rem; letter-spacing: -.01em; }
.brand:hover { text-decoration: none; }
.brand svg { width: 26px; height: 26px; flex: none; }
.brand .docs { font-weight: 500; color: var(--muted); padding-left: 10px; border-left: 1px solid var(--line); }
.top .spacer { flex: 1; }
.search-btn { display: flex; align-items: center; gap: 10px; width: min(320px, 40vw); height: 36px; padding: 0 10px 0 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--faint); font: inherit; font-size: .9rem; cursor: pointer; }
.search-btn kbd { margin-left: auto; font: 500 .72rem var(--font-mono); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; color: var(--muted); }
.icon-btn { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 8px; border: 1px solid transparent; background: none; color: var(--muted); cursor: pointer; }
.icon-btn:hover { background: var(--sunk); color: var(--fg); }
.icon-btn svg { width: 18px; height: 18px; }
.menu-btn { display: none; }

/* frame */
.frame { display: grid; grid-template-columns: 264px minmax(0, 1fr) 220px; max-width: 1360px; margin: 0 auto; }
.side { position: sticky; top: var(--top); height: calc(100vh - var(--top)); overflow-y: auto; padding: 24px 12px 40px 20px; border-right: 1px solid var(--line); }
.nav-sec { margin-bottom: 22px; }
.nav-sec h4 { margin: 0 0 6px 10px; font-size: .74rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); }
.nav-sec h5 { margin: 12px 0 4px 10px; font-size: .78rem; font-weight: 600; color: var(--muted); }
.nav-sec a { display: block; padding: 5px 10px; border-radius: 6px; color: var(--muted); font-size: .93rem; line-height: 1.4; }
.nav-sec a.mono { font-size: .82rem; }
.nav-sec a:hover { color: var(--fg); background: var(--sunk); text-decoration: none; }
.nav-sec a.on { color: var(--accent-ink); background: var(--accent-soft); font-weight: 600; }
main { min-width: 0; padding: 40px 48px 80px; }
.page { max-width: 46rem; }
.toc { position: sticky; top: var(--top); height: calc(100vh - var(--top)); overflow-y: auto; padding: 40px 20px 40px 8px; font-size: .86rem; }
.toc h4 { margin: 0 0 8px; font-size: .74rem; text-transform: uppercase; letter-spacing: .08em; color: var(--faint); font-weight: 600; }
.toc a { display: block; padding: 3px 0 3px 12px; border-left: 2px solid var(--line); color: var(--muted); line-height: 1.4; }
.toc a.sub { padding-left: 24px; font-size: .82rem; }
.toc a.on { color: var(--accent-ink); border-left-color: var(--accent); }
.toc a:hover { text-decoration: none; color: var(--fg); }

/* page type */
.crumb { font-size: .8rem; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); margin-bottom: 6px; }
h1 { margin: 0 0 14px; font-size: 2.3rem; line-height: 1.15; letter-spacing: -.025em; font-weight: 700; text-wrap: balance; }
h1 code { font-size: .9em; background: none; border: 0; padding: 0; }
h2 { margin: 2.6rem 0 .8rem; font-size: 1.42rem; letter-spacing: -.015em; line-height: 1.3; text-wrap: balance; }
h3 { margin: 1.9rem 0 .5rem; font-size: 1.1rem; line-height: 1.35; }
p, ul, ol { margin: 0 0 1rem; }
li { margin: .25rem 0; }
.lead { font-size: 1.14rem; color: var(--muted); line-height: 1.6; margin-bottom: 1.6rem; }
.caption { font-size: .86rem; color: var(--faint); margin-top: -.4rem; }
table { width: 100%; border-collapse: collapse; margin: 0 0 1.4rem; font-size: .93rem; display: block; overflow-x: auto; }
thead th { text-align: left; font-weight: 600; font-size: .8rem; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); border-bottom: 1px solid var(--line); padding: 8px 14px 8px 0; }
td { border-bottom: 1px solid var(--line); padding: 10px 14px 10px 0; vertical-align: top; }
td.num { font-variant-numeric: tabular-nums; font-family: var(--font-mono); font-size: .86rem; }
td code { white-space: nowrap; }
pre { position: relative; margin: 0 0 1.3rem; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; overflow-x: auto; font: .85rem/1.6 var(--font-mono); }
pre code { background: none; border: 0; padding: 0; font-size: inherit; }
.copy { position: absolute; top: 8px; right: 8px; padding: 3px 9px; font: 500 .74rem var(--font-sans); border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--muted); cursor: pointer; opacity: 0; transition: opacity .15s; }
pre:hover .copy, .copy:focus-visible { opacity: 1; }
.steps { padding-left: 1.4rem; }
.steps > li { padding-left: .3rem; margin-bottom: 1rem; }
.steps > li::marker { font-weight: 700; color: var(--accent); }
.note { display: grid; gap: 4px; margin: 0 0 1.4rem; padding: 14px 16px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line)); background: var(--accent-soft); font-size: .94rem; }
.note.warn { border-color: color-mix(in srgb, var(--warn) 35%, var(--line)); background: var(--warn-soft); }
.note p { margin: 0; }

/* a browser frame around a screenshot of the panel; the image follows the theme */
.shot { margin: 0 0 1.4rem; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--surface); box-shadow: 0 1px 2px rgb(0 0 0 / .04), 0 12px 32px -12px rgb(0 0 0 / .18); }
.shot-bar { display: flex; align-items: center; gap: 6px; padding: 9px 12px; border-bottom: 1px solid var(--line); background: var(--sunk); }
.shot-bar span { width: 10px; height: 10px; border-radius: 50%; background: var(--line); }
.shot-bar em { margin: 0 auto; font: 500 .74rem var(--font-mono); font-style: normal; color: var(--faint); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 2px 14px; }
.shot img { display: block; width: 100%; height: auto; }
.shot .dark { display: none; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .shot .light.has-dark { display: none; } :root:not([data-theme="light"]) .shot .dark { display: block; } }
:root[data-theme="dark"] .shot .light.has-dark { display: none; }
:root[data-theme="dark"] .shot .dark { display: block; }
.feature-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; margin: 0 0 1.6rem; }
.feature-grid div { border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; background: var(--surface); }
.feature-grid b { display: block; margin-bottom: 4px; }
.feature-grid span { color: var(--muted); font-size: .93rem; line-height: 1.5; }

/* terminal: dark in both themes, like the terminal itself */
.term { margin: 0 0 1.3rem; border-radius: 10px; overflow: hidden; background: var(--term-bg); border: 1px solid var(--line); }
.term-bar { display: flex; align-items: center; gap: 6px; padding: 8px 12px; background: var(--term-bar); }
.term-bar span { width: 10px; height: 10px; border-radius: 50%; background: #34313f; }
.term-bar em { margin-left: 8px; font: 500 .74rem var(--font-mono); font-style: normal; color: var(--term-dim); }
.term pre { margin: 0; border: 0; border-radius: 0; background: none; color: var(--term-fg); padding: 14px 16px 16px; font-size: .76rem; line-height: 1.55; }
.t-dim { color: var(--term-dim); }
.t-acc { color: #c678dd; }
.t-rule { color: #2e2b3a; }
.t-chip { color: #c678dd; background: #241f33; border-radius: 3px; padding: 0 4px; }
.t-warn { color: #e5c07b; }
.t-ok { color: #7ec699; }
.t-badge { color: #0f0e16; background: #e5c07b; font-weight: 700; }

/* home cards */
.pillars { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-bottom: 1.4rem; }
.pillar { display: block; padding: 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); }
.pillar:hover { border-color: var(--accent); text-decoration: none; }
.pillar h3 { margin: 0 0 4px; font-size: 1rem; }
.pillar p { margin: 0 0 10px; color: var(--muted); font-size: .9rem; }
.pillar ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 4px; }
.pillar li { margin: 0; }
.pillar li.more { font-size: .82rem; color: var(--faint); }
.next-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.next-grid a { display: grid; gap: 4px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); }
.next-grid a:hover { border-color: var(--accent); text-decoration: none; }
.next-grid span { font-size: .88rem; color: var(--muted); }

/* mod cards and meta */
.modgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 1rem; }
.modcard { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); color: var(--fg); }
.modcard:hover { border-color: var(--accent); text-decoration: none; }
.modcard p { margin: 0; font-size: .89rem; color: var(--muted); line-height: 1.5; }
.mc-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
.mc-head code { background: none; border: 0; padding: 0; font-weight: 700; font-size: .95rem; color: var(--fg); }
.ver { font: .74rem var(--font-mono); color: var(--faint); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: auto; }
.tag { font: 500 .72rem var(--font-mono); padding: 2px 7px; border-radius: 999px; background: var(--sunk); border: 1px solid var(--line); color: var(--muted); }
.tag.haiku { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 35%, var(--line)); background: var(--warn-soft); }
.modmeta { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin: -4px 0 18px; font-size: .84rem; color: var(--muted); }
.modmeta > span:not(.tag) { font-family: var(--font-mono); font-size: .78rem; padding-right: 8px; border-right: 1px solid var(--line); }
.modmeta .inst { margin-left: auto; font-size: .76rem; }
.src { display: inline-block; margin-top: 1.6rem; font-size: .88rem; }

/* pager */
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 2.6rem; padding-top: 1.6rem; border-top: 1px solid var(--line); }
.pager a { display: grid; gap: 2px; padding: 12px 16px; border: 1px solid var(--line); border-radius: 10px; color: var(--fg); font-weight: 600; }
.pager a:hover { border-color: var(--accent); text-decoration: none; }
.pager small { font-weight: 500; color: var(--faint); font-size: .78rem; }
.pager .next { text-align: right; }

/* search */
dialog.search { width: min(640px, calc(100vw - 32px)); max-height: 70vh; padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--fg); box-shadow: 0 24px 60px rgb(0 0 0 / .25); }
dialog.search::backdrop { background: rgb(5 12 14 / .45); }
.search input { width: 100%; padding: 16px 18px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--fg); font: inherit; font-size: 1.02rem; outline: none; }
.results { max-height: calc(70vh - 60px); overflow-y: auto; padding: 8px; }
.results a { display: grid; gap: 2px; padding: 10px 12px; border-radius: 8px; color: var(--fg); }
.results a small { color: var(--faint); font-size: .78rem; }
.results a span { color: var(--muted); font-size: .86rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.results a.sel, .results a:hover { background: var(--accent-soft); text-decoration: none; }
.results .empty { padding: 18px 12px; color: var(--faint); }

@media (max-width: 1180px) { .frame { grid-template-columns: 248px minmax(0, 1fr); } .toc { display: none; } }
@media (max-width: 860px) {
  .frame { grid-template-columns: minmax(0, 1fr); }
  .menu-btn { display: grid; }
  .side { position: fixed; z-index: 40; top: var(--top); left: 0; width: min(300px, 86vw); background: var(--bg); transform: translateX(-102%); transition: transform .2s; }
  body.nav-open .side { transform: none; box-shadow: 0 0 40px rgb(0 0 0 / .2); }
  main { padding: 28px 16px 64px; }
  .search-btn { width: auto; }
  .search-btn .label, .brand .docs { display: none; }
  .pillars, .next-grid, .modgrid { grid-template-columns: minmax(0, 1fr); }
  h1 { font-size: 1.9rem; }
  .modmeta .inst { margin-left: 0; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header class="top">
  <button class="icon-btn menu-btn" id="menu" aria-label="Open navigation" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <a class="brand" href="#intro" aria-label="Cockpit docs home">
    <!-- an attitude indicator: the horizon, banked a few degrees -->
    <svg viewBox="0 0 32 32" aria-hidden="true"><defs><clipPath id="dial"><circle cx="16" cy="16" r="13"/></clipPath></defs><circle cx="16" cy="16" r="14.5" style="fill:none;stroke:var(--fg)" stroke-width="2"/><g clip-path="url(#dial)"><rect x="0" y="0" width="32" height="32" style="fill:var(--accent-soft)"/><path d="M-4 19.5 36 13.5V40H-4z" style="fill:var(--accent)"/></g><path d="M8 16h5l3 3 3-3h5" style="fill:none;stroke:var(--fg)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    <span>Cockpit</span><span class="docs">Docs</span>
  </a>
  <span class="spacer"></span>
  <button class="search-btn" id="openSearch" aria-label="Search the docs"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="label">Search</span><kbd>/</kbd></button>
  <a class="icon-btn" href="https://github.com/joaosavi/cockpit" target="_blank" rel="noopener" aria-label="Cockpit on GitHub"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a10 10 0 0 0-3.16 19.49c.5.09.68-.22.68-.48v-1.7c-2.78.6-3.37-1.34-3.37-1.34-.45-1.16-1.11-1.47-1.11-1.47-.91-.62.07-.6.07-.6 1 .07 1.53 1.03 1.53 1.03.9 1.52 2.34 1.08 2.91.83.09-.65.35-1.09.63-1.34-2.22-.25-4.55-1.11-4.55-4.94 0-1.09.39-1.98 1.03-2.68-.1-.25-.45-1.27.1-2.65 0 0 .84-.27 2.75 1.02a9.6 9.6 0 0 1 5 0c1.91-1.29 2.75-1.02 2.75-1.02.55 1.38.2 2.4.1 2.65.64.7 1.03 1.59 1.03 2.68 0 3.84-2.34 4.69-4.57 4.93.36.31.68.92.68 1.85v2.75c0 .27.18.58.69.48A10 10 0 0 0 12 2z"/></svg></a>
  <button class="icon-btn" id="theme" aria-label="Switch between light and dark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
</header>

<div class="frame">
  <nav class="side" id="side" aria-label="Documentation">{{NAV}}</nav>
  <main id="main">{{PAGES}}</main>
  <aside class="toc" id="toc" aria-label="On this page"></aside>
</div>

<dialog class="search" id="search" aria-label="Search">
  <input id="q" type="search" placeholder="Search mods, commands, options" autocomplete="off">
  <div class="results" id="results"></div>
</dialog>

<script>
(function () {
  var pages = Array.prototype.slice.call(document.querySelectorAll('.page'));
  var byId = {};
  pages.forEach(function (p) { byId[p.id.slice(2)] = p; });
  var navLinks = Array.prototype.slice.call(document.querySelectorAll('.side a[data-page]'));
  var toc = document.getElementById('toc');
  var current = null;

  function show(hash) {
    var h = (hash || '').replace(/^#/, '') || 'intro';
    var page = byId[h], target = null;
    if (!page) {
      var el = document.getElementById(h);
      if (el) { page = el.closest('.page'); target = el; }
    }
    if (!page) page = byId.intro;
    if (current !== page) {
      pages.forEach(function (p) { p.hidden = p !== page; });
      current = page;
      var pid = page.id.slice(2);
      navLinks.forEach(function (a) { a.classList.toggle('on', a.dataset.page === pid); });
      document.title = page.dataset.title + ' · Cockpit Docs';
      buildToc(page);
    }
    document.body.classList.remove('nav-open');
    if (target) target.scrollIntoView(); else window.scrollTo(0, 0);
  }

  function buildToc(page) {
    var hs = page.querySelectorAll('h2[id], h3[id]');
    if (!hs.length) { toc.innerHTML = ''; return; }
    var html = '<h4>On this page</h4>';
    hs.forEach(function (h) { html += '<a href="#' + h.id + '"' + (h.tagName === 'H3' ? ' class="sub"' : '') + '>' + h.textContent + '</a>'; });
    toc.innerHTML = html;
    spy();
  }

  function spy() {
    if (!current) return;
    var links = toc.querySelectorAll('a'), on = null;
    current.querySelectorAll('h2[id], h3[id]').forEach(function (h) { if (h.getBoundingClientRect().top < 120) on = h.id; });
    links.forEach(function (a) { a.classList.toggle('on', a.getAttribute('href') === '#' + on); });
  }
  window.addEventListener('scroll', spy, { passive: true });
  window.addEventListener('hashchange', function () { show(location.hash); });

  // copy buttons on every code block outside the terminals
  document.querySelectorAll('main pre').forEach(function (pre) {
    if (pre.closest('.term')) return;
    var b = document.createElement('button');
    b.className = 'copy'; b.type = 'button'; b.textContent = 'Copy';
    b.addEventListener('click', function () {
      var text = pre.querySelector('code') ? pre.querySelector('code').textContent : pre.textContent;
      var done = function () { b.textContent = 'Copied'; setTimeout(function () { b.textContent = 'Copy'; }, 1400); };
      try {
        navigator.clipboard.writeText(text).then(done, function () { select(pre); });
      } catch (e) { select(pre); }
    });
    pre.appendChild(b);
  });
  function select(el) { var r = document.createRange(); r.selectNodeContents(el); var s = getSelection(); s.removeAllRanges(); s.addRange(r); }

  // theme
  var root = document.documentElement;
  try { var saved = localStorage.getItem('cockpit-theme'); if (saved) root.dataset.theme = saved; } catch (e) {}
  document.getElementById('theme').addEventListener('click', function () {
    var dark = root.dataset.theme ? root.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
    root.dataset.theme = dark ? 'light' : 'dark';
    try { localStorage.setItem('cockpit-theme', root.dataset.theme); } catch (e) {}
  });

  // mobile navigation
  var menu = document.getElementById('menu');
  menu.addEventListener('click', function () {
    var open = document.body.classList.toggle('nav-open');
    menu.setAttribute('aria-expanded', open ? 'true' : 'false');
  });

  // search
  var index = pages.map(function (p) {
    return { id: p.id.slice(2), title: p.dataset.title, section: p.dataset.section, text: p.textContent.replace(/\s+/g, ' ') };
  });
  var dlg = document.getElementById('search'), q = document.getElementById('q'), res = document.getElementById('results'), sel = 0;
  function open() { if (!dlg.open) { dlg.showModal(); q.value = ''; render(); q.focus(); } }
  function render() {
    var term = q.value.trim().toLowerCase();
    var hits = index.map(function (d) {
      if (!term) return { d: d, s: d.section === 'Get started' ? 2 : 1, at: -1 };
      var t = d.title.toLowerCase(), at = d.text.toLowerCase().indexOf(term);
      var s = (t === term ? 10 : 0) + (t.indexOf(term) >= 0 ? 6 : 0) + (at >= 0 ? 2 : 0);
      return { d: d, s: s, at: at };
    }).filter(function (h) { return h.s > 0; }).sort(function (a, b) { return b.s - a.s; }).slice(0, 12);
    if (!hits.length) { res.innerHTML = '<div class="empty">No page mentions “' + q.value.replace(/[<&]/g, '') + '”.</div>'; return; }
    sel = 0;
    res.innerHTML = hits.map(function (h, i) {
      var snip = h.at >= 0 ? h.d.text.slice(Math.max(0, h.at - 40), h.at + 90) : h.d.text.slice(0, 120);
      return '<a href="#' + h.d.id + '"' + (i === 0 ? ' class="sel"' : '') + '><small>' + h.d.section + '</small><b>' + h.d.title + '</b><span>' + snip.replace(/[<&]/g, '') + '</span></a>';
    }).join('');
  }
  q.addEventListener('input', render);
  q.addEventListener('keydown', function (e) {
    var items = res.querySelectorAll('a');
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      if (!items.length) return;
      items[sel].classList.remove('sel');
      sel = (sel + (e.key === 'ArrowDown' ? 1 : items.length - 1)) % items.length;
      items[sel].classList.add('sel'); items[sel].scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter' && items[sel]) { location.hash = items[sel].getAttribute('href'); dlg.close(); }
  });
  res.addEventListener('click', function (e) { if (e.target.closest('a')) dlg.close(); });
  dlg.addEventListener('click', function (e) { if (e.target === dlg) dlg.close(); });
  document.getElementById('openSearch').addEventListener('click', open);
  document.addEventListener('keydown', function (e) {
    var typing = /INPUT|TEXTAREA/.test(document.activeElement && document.activeElement.tagName);
    if ((e.key === '/' && !typing) || (e.key === 'k' && (e.metaKey || e.ctrlKey))) { e.preventDefault(); open(); }
  });

  show(location.hash);
})();
</script>
