# O unattended-upgrade chama o needrestart, e ele reinicia todo serviço que carrega biblioteca trocada.
# Em 15/10/2026 a atualização do libsystemd0 reiniciou os quatro *-rc às 06:24 e derrubou as sessões
# abertas. Eles ficam de fora: rodam com a biblioteca velha até o próximo reboot.
$nrconf{override_rc}{qr(^[a-z]+-rc\.service$)} = 0;
